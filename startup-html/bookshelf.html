<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Shelf Life</h1>

      <nav>
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="bookshelf.html">Bookshelf</a></li>
          <li><a href="bookbuzz.html">Book Buzz</a></li>
          <li><a href="bookclub.html">Book Club</a></li>
        </menu>
      </nav>

      <hr />
    </header>

    <main>
        <div class="columns">
            <div class="column">
                <h2>To Be Read</h2>
                <p>Books you want to read later</p>
                <div class="bookshelf">
                    <div class="shelf-top"></div>
                    <div class="shelf-left"></div>
                    <div class="shelf-right"></div>
                    <div class="shelf-bottom"></div>
                </div>
            </div>

            <div class="column">
                <h2>Currently Reading</h2>
                <p>Books you're reading now</p>
                <div class="bookshelf">
                    <div class="shelf-top"></div>
                    <div class="shelf-left"></div>
                    <div class="shelf-right"></div>
                    <div class="shelf-bottom"></div>
                </div>
            </div>

            <div class="column">
                <h2>Finished</h2>
                <p>Books you've finished</p>
                <div class="bookshelf">
                    <div class="shelf-top"></div>
                    <div class="shelf-left"></div>
                    <div class="shelf-right"></div>
                    <div class="shelf-bottom"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Author Name: Kaija Sorensen</span>
      <br />
      <a href="https://github.com/kaijakaye/startup">GitHub</a>
    </footer>
  </body>
</html>
