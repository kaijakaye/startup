<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelf Life HTML</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Shelf Life</h1>

      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Login</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="bookshelf.html">Bookshelf</a></li>
          <li><a href="bookbuzz.html">Book Buzz</a></li>
          <li><a href="bookclub.html">Book Club</a></li>
          <li><a href="bookprogress.html">Book Progress</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <h1>Welcome to Shelf Life</h1>
      <form method="get" action="bookshelf.html">
        <div>
          <span>@</span>
          <input type="text" placeholder="your@email.com" />
        </div>
        <div>
          <span>🔒</span>
          <input type="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
        <button type="submit">Create</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Author Name: Kaija Sorensen</span>
      <br />
      <a href="https://github.com/kaijakaye/startup">GitHub</a>
    </footer>
  </body>
</html>
