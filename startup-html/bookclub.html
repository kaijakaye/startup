<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Club</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Shelf Life</h1>

      <nav>
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="bookshelf.html">Bookshelf</a></li>
          <li><a href="bookbuzz.html">Book Buzz</a></li>
          <li><a href="bookclub.html">Book Club</a></li>
        </menu>
      </nav>

      <hr />
    </header>

    <main>
      <h2>Current Book: <i>East of Eden</i></h2>
      <table>
        <thead>
          <tr>
            <th>Reader</th>
            <th>Progress</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Kaija Sorensen</td>
            <td><label for="reading-progress">Reading Progress:</label> <progress id="reading-progress" value="65" max="100" color="green"></progress></td>
          </tr>
          <tr>
            <td>Abby Gugler</td>
            <td><label for="reading-progress-2">Reading Progress:</label> <progress id="reading-progress-2" value="30" max="100" color="green"></progress></td>
          </tr>
          <tr>
            <td>Cora Atkinson</td>
            <td><label for="reading-progress-3">Reading Progress:</label> <progress id="reading-progress-3" value="45" max="100" color="green"></progress></td>
          </tr>
        </tbody>
      </table>

      <h3>Add a Book Club Read</h3>
                <p>Enter the title of a book to read as a group</p>
                <form method="get" action="bookshelf.html">
                    <div>
                    <input type="text" placeholder="Book Title" />
                    </div>
                    <div>
                    <input type="text" placeholder="Author Name" />
                    </div>
                    <button type="submit">Add</button>
                </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Author Name: Kaija Sorensen</span>
      <br />
      <a href="https://github.com/kaijakaye/startup">GitHub</a>
    </footer>
  </body>
</html>
